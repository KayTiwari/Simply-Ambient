<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150F2E"/>
      <stop offset="45%" stop-color="#0B0B1F"/>
      <stop offset="100%" stop-color="#1A1230"/>
    </linearGradient>
    <radialGradient id="glow" cx="32%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5B6CFF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#A45BFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B0B1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#FF3838"/>
      <stop offset="17%" stop-color="#FF8A38"/>
      <stop offset="33%" stop-color="#FFD000"/>
      <stop offset="50%" stop-color="#3FE07F"/>
      <stop offset="67%" stop-color="#3FB6FF"/>
      <stop offset="83%" stop-color="#5B6CFF"/>
      <stop offset="100%" stop-color="#A45BFF"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- ensō ring -->
  <g transform="translate(250 250)">
    <circle cx="0" cy="0" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.55"
            stroke-width="3" stroke-linecap="round" stroke-dasharray="690 60"
            transform="rotate(-18)"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#A45BFF" stroke-opacity="0.35"
            stroke-width="8" stroke-linecap="round" stroke-dasharray="640 110"
            transform="rotate(-12)"/>
    <!-- inner binaural-wave hint -->
    <path d="M -60 0 Q -30 -38 0 0 Q 30 38 60 0" fill="none"
          stroke="#5BD0FF" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
    <path d="M -60 0 Q -30 38 0 0 Q 30 -38 60 0" fill="none"
          stroke="#9affc8" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="428" y="218" font-family="Georgia, 'Times New Roman', serif"
        font-size="70" fill="#FFFFFF" letter-spacing="1.5">Simply Ambient</text>

  <!-- divider -->
  <line x1="430" y1="252" x2="478" y2="252" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="492" y="258" font-family="Georgia, 'Times New Roman', serif"
        font-size="21" font-style="italic" fill="#ffffffcc" letter-spacing="3">your spiritual center</text>

  <!-- subtitle -->
  <text x="430" y="306" font-family="Helvetica, Arial, sans-serif"
        font-size="22" fill="#ffffffaa" letter-spacing="0.4">Binaural frequencies · breathwork · chakras</text>
  <text x="430" y="340" font-family="Helvetica, Arial, sans-serif"
        font-size="22" fill="#ffffffaa" letter-spacing="0.4">horoscopes · grounded daily practice</text>

  <!-- chakra spectrum bar -->
  <rect x="430" y="386" width="420" height="6" rx="3" fill="url(#spectrum)"/>
</svg>
