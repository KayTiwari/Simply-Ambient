<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAF7EE"/>
      <stop offset="100%" stop-color="#F0EBDD"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Icon: chakra wheel + stemmed leaf, transplanted from icon-master.svg.
       Original is 1024x1024 centred at (512,512); placed here scaled 0.42
       around (240,250). -->
  <g transform="translate(-9 35) scale(0.42)">
    <!-- chakra wheel: faint connecting ring + 7 chakra-coloured dots -->
    <circle cx="512" cy="512" r="300" fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="4"/>
    <circle cx="512.0" cy="212.0" r="27" fill="#FF3838"/>
    <circle cx="746.6" cy="325.0" r="27" fill="#FF8A38"/>
    <circle cx="804.5" cy="578.8" r="27" fill="#FFD000"/>
    <circle cx="642.2" cy="782.3" r="27" fill="#3FE07F"/>
    <circle cx="381.8" cy="782.3" r="27" fill="#3FB6FF"/>
    <circle cx="219.5" cy="578.8" r="27" fill="#5B6CFF"/>
    <circle cx="277.5" cy="325.0" r="27" fill="#A45BFF"/>

    <!-- stem (brown), leaf (vibrant green), vein (white) -->
    <path d="M 349 675 Q 305 717 295 758"
          fill="none" stroke="#8A5A2C" stroke-width="19" stroke-linecap="round"/>
    <path d="M 349 675 Q 703 703 675 349 Q 321 321 349 675 Z" fill="#20C94E"/>
    <path d="M 349 675 L 675 349" fill="none" stroke="#FFFFFF"
          stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="476" y="225" font-family="Georgia, 'Times New Roman', serif"
        font-size="68" fill="#1A1A2F" letter-spacing="1.5">Simply Ambient</text>

  <!-- Thin gold divider -->
  <line x1="478" y1="260" x2="540" y2="260" stroke="#C39A3E" stroke-width="1.5" opacity="0.85"/>

  <!-- Tagline -->
  <text x="554" y="266" font-family="Georgia, 'Times New Roman', serif"
        font-size="22" font-style="italic" fill="#5A5570" letter-spacing="2">Your spiritual center</text>

  <!-- Subtitle -->
  <text x="478" y="320" font-family="Helvetica, Arial, sans-serif"
        font-size="20" fill="#4a4757" letter-spacing="0.4">Binaural frequencies · Breathwork · Chakras</text>
  <text x="478" y="352" font-family="Helvetica, Arial, sans-serif"
        font-size="20" fill="#4a4757" letter-spacing="0.4">Horoscopes · Grounded daily practice</text>
</svg>
